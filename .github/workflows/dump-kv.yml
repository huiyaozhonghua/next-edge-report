name: Dump Progress KV

# 手动触发：打印 KV 里某个 key 的完整内容（用于确认进度同步存了什么）。
#
# 用法：Actions → Dump Progress KV → Run workflow
# 可选输入：key 名字（留空则列出全部 key）

on:
  workflow_dispatch:
    inputs:
      key:
        description: '要查看的 key 名（留空 = 列出全部）'
        required: false
        default: ''

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dump KV content
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANT_KEY: ${{ inputs.key }}
        run: |
          set -uo pipefail
          NS_ID="433142a7633a4ce98e060a589ccbeff7"

          KEYS=$(curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/${NS_ID}/keys" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for k in (d.get('result') or []): print(k.get('name'))
          ")

          echo "--- all keys ---"
          echo "${KEYS}" | sed 's/^/  /'

          if [ -n "${WANT_KEY}" ]; then
            TARGET="${WANT_KEY}"
          else
            TARGET=$(echo "${KEYS}" | head -1)
          fi

          if [ -z "${TARGET}" ]; then
            echo "  （KV 是空的 —— 还没有用户写过进度）"
            exit 0
          fi

          echo
          echo "--- content of: ${TARGET} ---"
          curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/${NS_ID}/values/${TARGET}" \
            | python3 -m json.tool 2>/dev/null \
            || echo "  (读取失败)"
